# Virtual Host de Nginx para Hostinger VPS (sin Docker)
# Proxy hacia server.js corriendo en el puerto 4321 (con PM2 o systemd)
#
# Guardar en: /etc/nginx/sites-available/6-aniversario
# Activar:    sudo ln -s /etc/nginx/sites-available/6-aniversario /etc/nginx/sites-enabled/
# Probar:     sudo nginx -t && sudo systemctl reload nginx
# SSL gratis: sudo certbot --nginx -d tu-dominio.com

server {
    listen 80;
    server_name tu-dominio.com;

    client_max_body_size 155M;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
